# Deploy lên Cloudflare (https://game.nauagency.asia/monopolyThaithinh/) mỗi khi main có commit mới và verify qua.
# Cần 2 secret trong repo: CLOUDFLARE_API_TOKEN (quyền Workers Scripts:Edit + Workers Routes:Edit cho zone nauagency.asia), CLOUDFLARE_ACCOUNT_ID.
# Thiếu secret thì job bỏ qua bước deploy, không báo lỗi.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
      - name: Deploy Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
      - name: Thiếu secret
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "Chưa có CLOUDFLARE_API_TOKEN — bỏ qua deploy."
