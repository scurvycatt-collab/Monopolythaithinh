# Mọi push / pull request phải qua kiểm tra bộ luật trước khi được merge hoặc deploy.
name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      # Cài đúng lockfile (cần acorn cho test biến chưa khai báo); bỏ postinstall nặng của sharp/wrangler.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run verify
