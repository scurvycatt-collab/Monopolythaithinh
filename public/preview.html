<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Preview màu ô đất</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Rubik:wght@700;800;900&family=Fredoka:wght@500;600;700&family=Be+Vietnam+Pro:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<div id="stage"></div>
<div id="cards"></div>
<div id="hub"></div>
<div id="zoom">
  <button type="button" id="zin" aria-label="Phóng to"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button type="button" id="zout" aria-label="Thu nhỏ"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
  <button type="button" id="zfit" aria-label="Xem toàn bàn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<div id="banner"></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<div id="info" role="dialog" aria-modal="true" aria-label="Thông tin ô"></div>
<div id="status" role="alert"></div>
<div id="sellbox"></div>
<div id="selltags"></div>
<div id="lobby" role="dialog" aria-modal="true" aria-label="Phòng chờ"></div>
<div id="conn" role="status">Mất kết nối tới server, đang thử lại…</div>
<button id="newgame" type="button">Ván mới</button>
<div id="credit">Mô hình 3D: <a href="https://www.kenney.nl" target="_blank" rel="noopener">Kenney.nl</a> (CC0)</div>
<div id="loading">Đang dựng bàn cờ…<small id="loadmsg">Tải mô hình 3D</small></div>
<script src="rules.js"></script>
<script src="game.js"></script>
<style>
#legend{position:fixed;left:12px;bottom:12px;z-index:23;background:rgba(255,255,255,.94);border-radius:14px;padding:10px 12px;box-shadow:0 8px 20px rgba(20,60,100,.18);font:600 12px 'Be Vietnam Pro',system-ui,sans-serif;color:#26364a;max-width:250px}
#legend b{display:block;font:800 14px 'Baloo 2',system-ui,sans-serif;margin-bottom:4px}
#legend div{display:flex;align-items:center;gap:8px;margin:4px 0}
#legend canvas{width:34px;height:22px;border-radius:5px;flex-shrink:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
@media (max-width:760px){#legend{display:none}}
</style>
<div id="legend"><b>Bản xem trước màu ô</b></div>
<script>
// chú thích: màu nền + hoa văn của từng nhóm (chỉ có ở bản xem trước)
addEventListener('load', () => {
  const L = document.getElementById('legend'), R = window.RULES, names = { A: 'Granada · Seville · Madrid', B: 'Hong Kong · Beijing · Shanghai', C: 'Venice · Milan · Rome', D: 'Hamburg · Berlin', E: 'London · Sydney', F: 'Chicago · Las Vegas · New York', G: 'Lyon · Paris', H: 'Osaka · Tokyo' };
  for (const [g, x] of Object.entries(R.GROUPS)) {
    const row = document.createElement('div'), cv = document.createElement('canvas'); cv.width = 68; cv.height = 44;
    const c = cv.getContext('2d'); c.fillStyle = x.ground; c.fillRect(0, 0, 68, 44);
    const im = new Image(); im.onload = () => {
      const t = document.createElement('canvas'); t.width = t.height = 256; const tc = t.getContext('2d'); tc.drawImage(im, 0, 0);
      const d = tc.getImageData(0, 0, 256, 256), p = d.data; let s = 0; for (let k = 0; k < p.length; k += 4) s += p[k]; const inv = s / (p.length / 4) < 128;
      const n = parseInt(x.ground.slice(1), 16), Lc = [n >> 16, (n >> 8) & 255, n & 255], Dk = Lc.map((v) => Math.round(v * 0.86));
      for (let k = 0; k < p.length; k += 4) { let q = p[k] / 255; if (inv) q = 1 - q; for (let j = 0; j < 3; j++) p[k + j] = Math.round(Dk[j] + (Lc[j] - Dk[j]) * q); p[k + 3] = 255; }
      tc.putImageData(d, 0, 0); const pat = c.createPattern(t, 'repeat'); pat.setTransform(new DOMMatrix().scale(0.25)); c.fillStyle = pat; c.fillRect(0, 0, 68, 44);
    };
    im.src = `patterns/pattern_${x.pattern}.png`;
    row.append(cv, document.createTextNode(names[g])); L.append(row);
  }
});
</script>
<div id="bigclock" aria-label="Thời gian còn lại của ván"></div>
<div id="dicesum"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
